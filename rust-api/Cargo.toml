[package]
name = "isms-api"
version = "0.1.0"
edition = "2024"
description = "ISMS Compliance Platform - Rust Backend API"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
bcrypt = "0.16"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# HTTP client (for Vanta API)
reqwest = { version = "0.12", features = ["json"] }

# Config
dotenvy = "0.15"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-actix-web = "0.7"
