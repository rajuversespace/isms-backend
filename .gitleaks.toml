# Gitleaks configuration for ISMS backend
# https://github.com/gitleaks/gitleaks

title = "ISMS Gitleaks Config"

# Extend the default ruleset (includes AWS, GCP, GitHub tokens, etc.)
[extend]
useDefault = true

# Paths to ignore (test fixtures, examples, lock files)
[allowlist]
  description = "Global allowlist"
  paths = [
    '''\.env\.example$''',
    '''Cargo\.lock$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''CLAUDE\.md$''',
    '''\.github/workflows/.*\.yml$''',
  ]

# Custom rules for ISMS-specific patterns

[[rules]]
  id = "vanta-client-secret"
  description = "Vanta API Client Secret"
  regex = '''(?i)vanta[_-]?(client[_-]?)?secret\s*[:=]\s*["']?[a-zA-Z0-9_\-]{20,}["']?'''
  keywords = ["vanta"]
  tags = ["vanta", "secret"]

[[rules]]
  id = "jwt-secret-hardcoded"
  description = "Hardcoded JWT secret (not env var reference)"
  regex = '''jwt[_-]?secret\s*[:=]\s*["'][a-zA-Z0-9!@#$%^&*()_\-+=]{8,}["']'''
  keywords = ["jwt_secret", "jwt-secret"]
  tags = ["jwt", "secret"]
  [rules.allowlist]
    # Allow the .env.example placeholder and test values
    regexes = [
      '''change-in-production''',
      '''test-secret''',
      '''dev-secret''',
    ]

[[rules]]
  id = "mongodb-uri-with-creds"
  description = "MongoDB URI containing credentials"
  regex = '''mongodb(\+srv)?://[a-zA-Z0-9_]+:[a-zA-Z0-9_!@#$%^&*]+@'''
  keywords = ["mongodb"]
  tags = ["mongodb", "credentials"]
