name: AI Code Review (Rust Backend)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "rust-api/**"

permissions:
  contents: read
  pull-requests: write
  # Required for Copilot code review
  copilot: write

jobs:
  # ──────────────────────────────────────────────────────────
  # Primary: GitHub Copilot Code Review (free, no API key)
  # ──────────────────────────────────────────────────────────
  copilot-review:
    name: Copilot Rust Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: GitHub Copilot Code Review
        uses: copilot/code-review-action@v1
        with:
          # Only review Rust files in the backend
          path-filters: |
            - "rust-api/**/*.rs"
            - "rust-api/Cargo.toml"
          model: copilot
          # Custom instructions for Rust/ISMS context
          copilot-review-instructions: |
            This is an ISMS (Information Security Management System) backend built with
            Rust, Actix-web 4, and MongoDB. Review with focus on:

            SECURITY (highest priority for an ISMS product):
            - Authentication/authorization bypass in JWT Claims extractor or RBAC guards
            - NoSQL injection via unsanitized input in MongoDB doc! queries
            - Secret/credential exposure (hardcoded keys, tokens in logs)
            - Missing input validation on request DTOs
            - CORS misconfiguration

            RUST BEST PRACTICES:
            - No unwrap()/expect() in production handler/service code (only in tests/main startup)
            - Proper error propagation with ? operator and AppError enum
            - Idiomatic ownership/borrowing (avoid unnecessary clones)
            - Correct serde attributes (#[serde(rename, skip_serializing_if, default)])
            - Async safety: no blocking calls in async handlers (bcrypt is fine)

            LOGIC:
            - MongoDB query correctness (deleted_at: null filters, org_id scoping)
            - JWT/RBAC permission checks on every protected endpoint
            - Edge cases: empty collections, missing optional fields, duplicate email handling

            PERFORMANCE:
            - Unnecessary String allocations where &str would work
            - N+1 database query patterns
            - Missing indexes for query patterns used in services

  # ──────────────────────────────────────────────────────────
  # Fallback: OpenAI ChatGPT review (when API key is available)
  # ──────────────────────────────────────────────────────────
  chatgpt-review:
    name: ChatGPT Rust Review (Fallback)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    # Only run if the OPENAI_API_KEY secret exists
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - name: Check for API key
        id: check_key
        run: |
          if [ "$HAS_OPENAI_KEY" != "true" ]; then
            echo "OPENAI_API_KEY not configured — skipping ChatGPT review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check_key.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff (Rust files only)
        if: steps.check_key.outputs.skip != 'true'
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            | awk '/^diff --git.*rust-api\//,/^diff --git/' \
            | head -c 100000)

          if [ -z "$DIFF" ]; then
            echo "No Rust file changes found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$DIFF" > /tmp/pr_diff.txt
          echo "skip=false" >> "$GITHUB_OUTPUT"

          CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --name-only \
            | grep '^rust-api/' | grep '\.rs$' || true)
          echo "$CHANGED_FILES" > /tmp/changed_files.txt

      - name: Collect file contents
        if: steps.check_key.outputs.skip != 'true' && steps.diff.outputs.skip != 'true'
        run: |
          TOTAL=0
          MAX_BYTES=200000
          > /tmp/file_contents.txt

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue
            FILE_SIZE=$(wc -c < "$file")
            NEW_TOTAL=$((TOTAL + FILE_SIZE))
            if [ "$NEW_TOTAL" -gt "$MAX_BYTES" ]; then
              continue
            fi
            echo "========== FILE: $file ==========" >> /tmp/file_contents.txt
            cat "$file" >> /tmp/file_contents.txt
            echo "" >> /tmp/file_contents.txt
            TOTAL=$NEW_TOTAL
          done < /tmp/changed_files.txt

      - name: Call OpenAI API
        if: steps.check_key.outputs.skip != 'true' && steps.diff.outputs.skip != 'true'
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)
          FILE_CONTENTS=$(cat /tmp/file_contents.txt)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY=$(echo "${{ github.event.pull_request.body }}" | head -c 2000)

          SYSTEM_PROMPT='You are a senior Rust engineer reviewing a pull request for an ISMS (Information Security Management System) backend built with Actix-web 4 and MongoDB.

          Review for: (1) Security vulnerabilities — auth bypass, NoSQL injection, secret exposure, input validation, CORS. (2) Rust best practices — no unwrap() in prod, proper error handling with ?, idiomatic ownership, serde correctness, async safety. (3) Logic bugs — race conditions, missing edge cases, incorrect MongoDB filters, JWT/RBAC correctness. (4) Performance — unnecessary allocations, N+1 queries, missing indexes.

          Format your review as:
          ### Summary
          One paragraph.
          ### Critical Issues (❌)
          Must fix before merge.
          ### Warnings (⚠️)
          Should fix.
          ### Suggestions (💡)
          Nice-to-have.
          ### Good Patterns (✅)
          Things done well.
          Omit empty sections. Reference file names and line numbers. Be concise.'

          USER_MSG=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg diff "$DIFF" \
            --arg files "$FILE_CONTENTS" \
            '"Review this PR:\n\nTitle: \($title)\n\nDescription:\n\($body)\n\nDiff:\n```\n\($diff)\n```\n\nFull files:\n```\n\($files)\n```"')

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n \
              --arg system "$SYSTEM_PROMPT" \
              --argjson user "$USER_MSG" \
              '{
                model: "gpt-4.1",
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: $user }
                ],
                temperature: 0.2,
                max_tokens: 4096
              }')")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "OpenAI API error (HTTP $HTTP_CODE)"
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REVIEW=$(echo "$BODY" | jq -r '.choices[0].message.content')
          MODEL_USED=$(echo "$BODY" | jq -r '.model')
          TOKENS=$(echo "$BODY" | jq -r '.usage.total_tokens')

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "$REVIEW"
            echo ""
            echo "---"
            echo "*Reviewed by \`${MODEL_USED}\` | ${TOKENS} tokens | Rust files only*"
          } > /tmp/review.md

          echo "review_failed=false" >> "$GITHUB_OUTPUT"

      - name: Post ChatGPT review comment
        if: steps.check_key.outputs.skip != 'true' && steps.diff.outputs.skip != 'true' && steps.review.outputs.review_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT="## 🤖 ChatGPT Code Review (Rust Backend)

          $(cat /tmp/review.md)"

          EXISTING=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("## 🤖 ChatGPT Code Review")) | .id' \
            | head -1)

          if [ -n "$EXISTING" ]; then
            gh api \
              "repos/${{ github.repository }}/issues/comments/$EXISTING" \
              -X PATCH -f body="$COMMENT"
          else
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} --body "$COMMENT"
          fi
