name: AI Code Review (Rust Backend)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "rust-api/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: ChatGPT Rust Review
    runs-on: ubuntu-latest
    # Skip bot PRs (Dependabot, etc.)
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff (Rust files only)
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the diff for rust-api/ files only
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            | awk '/^diff --git.*rust-api\//,/^diff --git/' \
            | head -c 100000)

          if [ -z "$DIFF" ]; then
            echo "No Rust file changes found in this PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Save diff to file (avoid shell escaping issues)
          echo "$DIFF" > /tmp/pr_diff.txt
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Also grab the list of changed Rust files
          CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --name-only \
            | grep '^rust-api/' | grep '\.rs$' || true)
          echo "$CHANGED_FILES" > /tmp/changed_files.txt

          echo "Changed Rust files:"
          cat /tmp/changed_files.txt

      - name: Read changed file contents for context
        if: steps.diff.outputs.skip != 'true'
        run: |
          # Collect full contents of changed Rust files (up to 200KB total)
          TOTAL=0
          MAX_BYTES=200000
          > /tmp/file_contents.txt

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ ! -f "$file" ] && continue

            FILE_SIZE=$(wc -c < "$file")
            NEW_TOTAL=$((TOTAL + FILE_SIZE))

            if [ "$NEW_TOTAL" -gt "$MAX_BYTES" ]; then
              echo "--- Skipping $file (would exceed size limit) ---" >> /tmp/file_contents.txt
              continue
            fi

            echo "========== FILE: $file ==========" >> /tmp/file_contents.txt
            cat "$file" >> /tmp/file_contents.txt
            echo "" >> /tmp/file_contents.txt
            TOTAL=$NEW_TOTAL
          done < /tmp/changed_files.txt

          echo "Collected $(wc -c < /tmp/file_contents.txt) bytes of file contents"

      - name: Run ChatGPT Review
        if: steps.diff.outputs.skip != 'true'
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)
          FILE_CONTENTS=$(cat /tmp/file_contents.txt)
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY=$(echo "${{ github.event.pull_request.body }}" | head -c 2000)

          # Build the prompt
          SYSTEM_PROMPT='You are a senior Rust engineer reviewing a pull request for an ISMS (Information Security Management System) backend built with Actix-web 4 and MongoDB.

          Your review must cover ALL of the following areas:

          ## 1. Security Vulnerabilities
          - Authentication/authorization bypass opportunities
          - Input validation gaps (SQL/NoSQL injection, XSS via stored data)
          - Secret/credential exposure risks
          - Insecure deserialization
          - Missing rate limiting considerations
          - CORS misconfiguration

          ## 2. Rust Best Practices
          - Idiomatic Rust patterns (ownership, borrowing, lifetimes)
          - Proper error handling (no unwrap() in production paths, proper ? propagation)
          - Unsafe code review (if any)
          - Type safety and enum usage
          - Serde derive correctness
          - Proper use of async/await with actix-web

          ## 3. Logic Bugs
          - Off-by-one errors, boundary conditions
          - Race conditions in async code
          - Missing edge cases (empty collections, None values, deleted records)
          - Incorrect MongoDB query filters
          - JWT/RBAC logic correctness

          ## 4. Performance
          - Unnecessary allocations (String vs &str, Vec cloning)
          - N+1 query patterns
          - Blocking operations in async context (bcrypt is OK — it uses spawn_blocking internally)
          - Missing database indexes for query patterns
          - Unnecessary serialization/deserialization

          ## Output Format
          Structure your review as:

          ### Summary
          One paragraph overall assessment.

          ### Critical Issues
          Issues that MUST be fixed before merge. Use ❌ prefix.

          ### Warnings
          Issues that SHOULD be fixed. Use ⚠️ prefix.

          ### Suggestions
          Nice-to-have improvements. Use 💡 prefix.

          ### Approved Patterns
          Things done well worth noting. Use ✅ prefix.

          If there are no issues in a category, omit that section.
          Be specific — reference file names, line numbers, and code snippets.
          Be concise — do not pad with generic advice.'

          # Build the user message with jq to handle escaping
          USER_MSG=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg body "$PR_BODY" \
            --arg diff "$DIFF" \
            --arg files "$FILE_CONTENTS" \
            '{
              pr_title: $title,
              pr_description: $body,
              diff: $diff,
              full_file_contents: $files
            } | "Review this Pull Request:\n\nTitle: \(.pr_title)\n\nDescription:\n\(.pr_description)\n\nDiff:\n```\n\(.diff)\n```\n\nFull file contents for context:\n```\n\(.full_file_contents)\n```"')

          # Call OpenAI API
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n \
              --arg system "$SYSTEM_PROMPT" \
              --argjson user "$USER_MSG" \
              '{
                model: "gpt-4.1",
                messages: [
                  { role: "system", content: $system },
                  { role: "user", content: $user }
                ],
                temperature: 0.2,
                max_tokens: 4096
              }')")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "OpenAI API returned HTTP $HTTP_CODE"
            echo "$BODY" | jq '.error' 2>/dev/null || echo "$BODY"
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            exit 0  # Don't fail the workflow, just skip posting
          fi

          # Extract the review content
          REVIEW=$(echo "$BODY" | jq -r '.choices[0].message.content')
          MODEL_USED=$(echo "$BODY" | jq -r '.model')
          TOKENS_USED=$(echo "$BODY" | jq -r '.usage.total_tokens')

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            echo "Empty response from OpenAI"
            echo "review_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Save review to file
          echo "$REVIEW" > /tmp/review.md

          # Append metadata
          echo "" >> /tmp/review.md
          echo "---" >> /tmp/review.md
          echo "*Reviewed by \`${MODEL_USED}\` | ${TOKENS_USED} tokens | Rust files only*" >> /tmp/review.md

          echo "review_failed=false" >> "$GITHUB_OUTPUT"
          echo "Review generated successfully ($TOKENS_USED tokens)"

      - name: Post review comment on PR
        if: steps.diff.outputs.skip != 'true' && steps.review.outputs.review_failed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the comment
          COMMENT="## 🤖 AI Code Review (Rust Backend)

          $(cat /tmp/review.md)"

          # Check if we already posted a review comment on this PR
          EXISTING_COMMENT_ID=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("## 🤖 AI Code Review")) | .id' \
            | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            # Update existing comment
            gh api \
              "repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID" \
              -X PATCH \
              -f body="$COMMENT"
            echo "Updated existing review comment #$EXISTING_COMMENT_ID"
          else
            # Create new comment
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "$COMMENT"
            echo "Posted new review comment"
          fi

      - name: Post skip notice
        if: steps.diff.outputs.skip == 'true'
        run: echo "No Rust file changes in this PR — skipping AI review."

      - name: Post failure notice
        if: steps.review.outputs.review_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## 🤖 AI Code Review (Rust Backend)

          > ⚠️ AI review could not be completed. The OpenAI API returned an error. Check the workflow logs for details.
          >
          > This does not block the PR — manual review is still required."
